{% extends "base.html" %}

{% block title %}Log in · SecureNotes{% endblock %}

{% block content %}
  <h1>Log in</h1>

  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="username">Username</label>
    <input id="username" name="username" required maxlength="30" autocomplete="username">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required maxlength="128"
           autocomplete="current-password">

    <button type="submit">Log in</button>
  </form>

  <p>No account yet? <a href="{{ url_for('auth.register') }}">Register</a></p>
{% endblock %}
